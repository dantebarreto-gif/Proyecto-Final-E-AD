<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2412d"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#111">Pipeline de 10 etapas: cada salida alimenta a la siguiente</text>
  <text x="20" y="50" font-size="12" fill="#52514e">Lo bloqueado en S6 no llega a índices, similitud ni grafo. Las etapas [FIJA] van resaltadas.</text>
  <g fill="none" stroke="#6b6a66" stroke-width="1.4">
    <path d="M20 150H88" marker-end="url(#a)"/>
    <path d="M238 150H262" marker-end="url(#a)"/>
    <path d="M412 150H436" marker-end="url(#a)"/>
    <path d="M586 150H610" marker-end="url(#a)"/>
    <path d="M760 150H784" marker-end="url(#a)"/>
    <path d="M859 196V230H125V262" marker-end="url(#a)"/>
    <path d="M330 230V262" marker-end="url(#a)"/>
    <path d="M535 230V262" marker-end="url(#a)"/>
    <path d="M740 230V262" marker-end="url(#a)"/>
    <path d="M125 354V392H785" marker-end="url(#a)"/>
    <path d="M330 354V392"/>
    <path d="M535 354V392"/>
    <path d="M740 354V392"/>
  </g>
  <path d="M934 150H975V100" fill="none" stroke="#c2412d" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="900" y="90" font-size="11.5" fill="#c2412d">alertas (heap)</text>
  <text x="18" y="140" font-size="12" fill="#52514e">stream</text>
  <g>
    <rect x="90" y="104" width="148" height="92" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="164" y="128" text-anchor="middle" font-weight="700" fill="#111">S0 Ingesta</text>
    <text x="164" y="150" text-anchor="middle" font-size="11.5" fill="#333">cola FIFO enlazada</text>
    <text x="164" y="168" text-anchor="middle" font-size="11.5" fill="#333">con backpressure</text>
  </g>
  <g>
    <rect x="264" y="104" width="148" height="92" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="338" y="128" text-anchor="middle" font-weight="700" fill="#111">S1 Limpieza</text>
    <text x="338" y="150" text-anchor="middle" font-size="11.5" fill="#333">merge sort +</text>
    <text x="338" y="168" text-anchor="middle" font-size="11.5" fill="#333">búsqueda binaria</text>
    <text x="338" y="186" text-anchor="middle" font-size="11" fill="#52514e">valida y deduplica</text>
  </g>
  <g>
    <rect x="438" y="104" width="148" height="92" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="512" y="128" text-anchor="middle" font-weight="700" fill="#111">S2 Prioridad</text>
    <text x="512" y="150" text-anchor="middle" font-size="11.5" fill="#333">heap binario</text>
    <text x="512" y="168" text-anchor="middle" font-size="11.5" fill="#333">express primero</text>
  </g>
  <g>
    <rect x="612" y="104" width="148" height="92" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="686" y="128" text-anchor="middle" font-weight="700" fill="#111">S3 Lookup</text>
    <text x="686" y="150" text-anchor="middle" font-size="11.5" fill="#333">hash + LRU +</text>
    <text x="686" y="168" text-anchor="middle" font-size="11.5" fill="#333">matriz dispersa</text>
  </g>
  <g>
    <rect x="786" y="104" width="148" height="92" rx="8" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2.2"/>
    <text x="860" y="128" text-anchor="middle" font-weight="700" fill="#111">S6 Filtrado</text>
    <text x="860" y="150" text-anchor="middle" font-size="11.5" fill="#111">Bloom (lista negra)</text>
    <text x="860" y="168" text-anchor="middle" font-size="11.5" fill="#111">+ CMS (10 min)</text>
  </g>
  <text x="140" y="224" font-size="11.5" fill="#52514e">eventos legítimos</text>
  <g>
    <rect x="50" y="264" width="150" height="90" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="125" y="288" text-anchor="middle" font-weight="700" fill="#111">S4 Disco</text>
    <text x="125" y="310" text-anchor="middle" font-size="11.5" fill="#333">B+Tree 4 KB</text>
    <text x="125" y="328" text-anchor="middle" font-size="11.5" fill="#333">precio y órdenes</text>
  </g>
  <g>
    <rect x="255" y="264" width="150" height="90" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="330" y="288" text-anchor="middle" font-weight="700" fill="#111">S5 Atributos</text>
    <text x="330" y="310" text-anchor="middle" font-size="11.5" fill="#333">KD-Tree 3D</text>
    <text x="330" y="328" text-anchor="middle" font-size="11.5" fill="#333">+ KNN exacto</text>
  </g>
  <g>
    <rect x="460" y="264" width="150" height="90" rx="8" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2.2"/>
    <text x="535" y="288" text-anchor="middle" font-weight="700" fill="#111">S7 Similitud</text>
    <text x="535" y="310" text-anchor="middle" font-size="11.5" fill="#111">MinHash + LSH</text>
    <text x="535" y="328" text-anchor="middle" font-size="11.5" fill="#111">IVF (HNSW ref.)</text>
  </g>
  <g>
    <rect x="665" y="264" width="150" height="90" rx="8" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2.2"/>
    <text x="740" y="288" text-anchor="middle" font-weight="700" fill="#111">S8 Grafo</text>
    <text x="740" y="310" text-anchor="middle" font-size="11.5" fill="#111">co-compra: PageRank</text>
    <text x="740" y="328" text-anchor="middle" font-size="11.5" fill="#111">+ Louvain / LPA</text>
  </g>
  <g>
    <rect x="787" y="368" width="190" height="80" rx="8" fill="#fff" stroke="#6b6a66" stroke-width="1.3"/>
    <text x="882" y="392" text-anchor="middle" font-weight="700" fill="#111">S9 Servicio</text>
    <text x="882" y="413" text-anchor="middle" font-size="11.5" fill="#333">Trie, Top-K, recomendación</text>
    <text x="882" y="431" text-anchor="middle" font-size="11.5" fill="#333">panel Streamlit</text>
  </g>
