[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-stream-pipeline"
version = "1.0.0"
description = "Pipeline de data streams con estructuras de datos avanzadas (UTEC EDA 2026-2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "duckdb>=0.9", "matplotlib>=3.7"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7", "networkx>=3", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
